name: CI - Calidad CafeGestión

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, build, pruebas, cobertura)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Valor ficticio: solo para generar el cliente de Prisma, no se conecta a ninguna base.
      DATABASE_URL: postgresql://usuario:clave@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependencias
        run: npm ci --ignore-scripts
      - name: Generar cliente de Prisma
        run: npx prisma generate
      - name: Lint (oxlint)
        run: npm run lint
      - name: Compilar
        run: npm run build
      - name: Pruebas unitarias con cobertura (falla si baja del umbral)
        run: npm run test:cov
      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/coverage
          if-no-files-found: ignore

  frontend:
    name: Frontend (tipos, lint, pruebas RTL, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci --ignore-scripts
      - name: Revisar tipos (TypeScript)
        run: npm run typecheck
      - name: Lint (Biome)
        run: npm run lint
      - name: Pruebas de componentes (Vitest + RTL)
        run: npm test
      - name: Compilar (next build)
        run: npm run build

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    steps:
      - name: Evaluar resultado
        run: |
          echo "backend:  ${{ needs.backend.result }}"
          echo "frontend: ${{ needs.frontend.result }}"
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "Quality gate NO superado: hay etapas fallidas."
            exit 1
          fi
          echo "Quality gate superado."
